name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: ubuntu-x86_64
            executable: BlogStudio-linux-x86_64
          - os: windows-2022
            name: windows-x86_64
            executable: BlogStudio.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test editor and desktop lifecycle
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Test browser workflows
        if: runner.os == 'Linux'
        run: python tests/browser_smoke.py
      - name: Build standalone application
        run: python build_desktop.py
      - name: Test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/package_smoke.py dist/${{ matrix.executable }}
      - name: Test packaged application on Windows
        if: runner.os == 'Windows'
        run: python tests/package_smoke.py dist/${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: BlogStudio-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
